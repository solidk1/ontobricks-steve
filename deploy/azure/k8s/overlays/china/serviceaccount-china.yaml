# The managed identity is per-deployment, so it is patched here rather than set in
# the shared base — a base carrying one cloud's client id would silently hand it
# to every other deployment built on it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ontobricks
  annotations:
    azure.workload.identity/client-id: "f0baa71a-a926-40a9-bc4a-f11c76dcabe0"
