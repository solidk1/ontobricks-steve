# Azure China (portal.azure.cn) — an overlay, not a copy.
#
# Everything structural (replicas 1, Recreate, workload identity, probes,
# security context) comes from ../.. and is shared. Only the endpoints differ,
# because Azure China is a separate cloud with its own ARM, Entra and data-plane
# domains.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../..

# The base is global-cloud shaped; these patch only what differs for China —
# endpoints, the registry domain, and the managed identity, which is
# per-deployment rather than per-cloud.
patches:
  - path: configmap-china.yaml
  - path: deployment-china.yaml
  - path: serviceaccount-china.yaml
