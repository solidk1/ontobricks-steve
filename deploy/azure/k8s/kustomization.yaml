apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ontobricks

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - service.yaml
  - deployment.yaml

# `labels`, not `commonLabels`: the latter is deprecated and, more importantly,
# injects into `spec.selector` too. Selectors are immutable after creation, so a
# later change to this block would make the Deployment un-updatable. The pod and
# Service selectors are declared explicitly in their own files instead.
labels:
  - pairs:
      app.kubernetes.io/name: ontobricks
    includeSelectors: false
