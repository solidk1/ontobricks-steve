# Workload Identity: the annotation binds this service account to a
# user-assigned managed identity, and the AKS webhook then projects a token the
# Azure SDK can exchange. `DefaultAzureCredential` in
# back/core/postgres/EntraCredential.py picks it up with no code change, which is
# why PostgreSQL auth needs nothing AKS-specific beyond this file.
#
# Replace the client id, and federate the identity to
# system:serviceaccount:ontobricks:ontobricks (see README).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ontobricks
  annotations:
    azure.workload.identity/client-id: "REPLACE_WITH_MANAGED_IDENTITY_CLIENT_ID"
